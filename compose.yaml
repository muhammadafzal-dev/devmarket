services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devmarket
      POSTGRES_PASSWORD: devmarket
      POSTGRES_DB: devmarket
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devmarket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmarket"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  devmarket_data:
